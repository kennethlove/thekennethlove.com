name: Verify build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo (version from netlify.toml)
        run: |
          HUGO_VERSION="$(grep -o 'HUGO_VERSION = "[^"]*"' netlify.toml | head -1 | cut -d'"' -f2)"
          if [ -z "$HUGO_VERSION" ]; then
            echo "::error::Could not read HUGO_VERSION from netlify.toml"
            exit 1
          fi
          echo "Installing Hugo v${HUGO_VERSION}"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Build
        run: hugo --gc --minify
