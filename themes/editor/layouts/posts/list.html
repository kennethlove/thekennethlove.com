{{ define "title" }}{{ .Title }} from {{ .Site.Title }}{{ end }}

{{ define "main" }}
<section>
    <header>
        <h1>{{.Title}}</h1>
    </header>

    {{ .Content }}

    <nav id="post-list">
        {{ range .Data.Pages.ByPublishDate.Reverse }}
        <article>
            <a href="{{ .Permalink }}">{{ .Title }}</a>
            <time datetime="{{.PublishDate }}">{{ .PublishDate.Format "2006-01-02" }}</time>
            <p>{{ .Summary | plainify }}</p>
        </article>
        {{ end }}
    </nav>
</section>
{{ end }}
